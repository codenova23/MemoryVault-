  <svg class="sr-only" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></symbol>

    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 14l1 2.5 2.5 1-2.5 1L19 21l-1-2.5-2.5-1 2.5-1zM5 3l.7 1.8L7.5 5.5l-1.8.7L5 8l-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M20 16.5v3A1.5 1.5 0 0 1 18.5 21h-13A1.5 1.5 0 0 1 4 19.5v-3"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  </svg>
  <div id="app"></div>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'memory-vault-one-file-v1';
      const imageUrl = (id) => `https://images.unsplash.com/${id}?auto=format&fit=crop&w=1000&q=85`;
      const demoMemories = [
        {id:'demo-goa',title:'A little Goa escape',date:'2026-08-14',location:'Goa, India',description:'Salt in our hair, nowhere to be, and one more sunset before we left.',category:'Travel',tags:['Travel','Friends','Beach','Summer'],people:'Maya, Dev, Aanya',favorite:true,photo:imageUrl('photo-1500530855697-b586d89ba3ee'),timeline:['10:30 AM · First dip in the sea','1:15 PM · Lunch that lasted hours','5:42 PM · One last sunset'],demo:true},
        {id:'demo-college',title:'College, lately',date:'2026-09-18',location:'Pune, India',description:'Coffee runs, borrowed notes, and the people who made it feel like home.',category:'College',tags:['College','Friends','Everyday'],people:'The usual crew',favorite:false,photo:imageUrl('photo-1529156069898-49953e39b3ac'),timeline:['9:10 AM · The walk across campus','1:20 PM · Lunch between lectures','5:00 PM · One for the group chat'],demo:true},
        {id:'demo-birthday',title:'A birthday in full color',date:'2026-07-20',location:'Mumbai, India',description:'A tiny cake, a very loud room, and the best kind of happy tears.',category:'Celebrations',tags:['Celebration','Friends','Birthday'],people:'Nina and the gang',favorite:true,photo:imageUrl('photo-1511795409834-ef04bbd61622'),timeline:['7:30 PM · The first arrivals','8:30 PM · Make a wish','9:10 PM · Confetti everywhere'],demo:true},
        {id:'demo-family',title:'Sunday at home',date:'2026-06-07',location:'Jaipur, India',description:'Everyone around the table, telling the same stories all over again.',category:'Family',tags:['Family','Food','Home'],people:'All of us',favorite:false,photo:imageUrl('photo-1511895426328-dc8714191300'),timeline:['11:45 AM · Someone set the table','1:15 PM · Second helpings','3:40 PM · The stories we know by heart'],demo:true},
        {id:'demo-sunset',title:'The long way home',date:'2024-10-07',location:'Marine Drive, Mumbai',description:'We stopped for five minutes. The sky had other plans.',category:'Nature',tags:['Nature','Sunset','Friends','Evening'],people:'Maya',favorite:true,photo:imageUrl('photo-1470770841072-f978cf4d019e'),timeline:['5:42 PM · Five more minutes','6:03 PM · The sky turned apricot','6:28 PM · The long way home'],demo:true}
      ];
      const categoryNames = ['Friends','Family','College','Travel','Celebrations','Nature','Food','Special Moments'];
      const icon = (name, size = 17) => `<svg aria-hidden="true" style="width:${size}px;height:${size}px"><use href="#i-${name}"></use></svg>`;
      const escapeHTML = (value = '') => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
      const tomorrow = () => { const d = new Date(); d.setDate(d.getDate()+1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
      const parseDate = (value) => { const date = new Date(`${value}T12:00:00`); return Number.isNaN(date.getTime()) ? new Date() : date; };
      const formatDate = (value, options = {month:'long',day:'numeric',year:'numeric'}) => new Intl.DateTimeFormat('en', options).format(parseDate(value));
      const seedYear = new Date().getFullYear();
      demoMemories.forEach((memory, index) => {
        const date = parseDate(memory.date);
        if (index < 4) { date.setFullYear(seedYear); memory.date = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
      });
      let state = loadState();
      let page = 'home';
      let activeCategory = 'All memories';
      let searchQuery = '';
      let selectedMemoryId = null;
      let selectedCapsuleId = null;
      let modal = '';
      let draftPhoto = '';
      let sortOrder = 'newest';
      let toastTimer = 0;
      let mobileOpen = false;
      const app = document.getElementById('app');

      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.memories) && Array.isArray(parsed.capsules)) return parsed;
          }
        } catch (error) { console.warn('Memory Vault could not read saved data.', error); }
        return {memories: demoMemories, capsules: []};
      }
      function persist(next) {
        state = next;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
        catch (error) { console.error('Memory Vault could not save data.', error); showStorageWarning(); return false; }
      }
      function showStorageWarning() {
        let warning = document.querySelector('.storage-warning');
        if (!warning) { warning = document.createElement('div'); warning.className = 'storage-warning'; document.body.appendChild(warning); }
        warning.textContent = 'This browser is low on storage. Try a smaller photo or remove older memories.';
      }
      function notify(message) {
        document.querySelector('.toast')?.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span class="toast-check">${icon('check',13)}</span><span>${escapeHTML(message)}</span>`;
        document.body.appendChild(toast);
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.remove(), 3000);
      }
      function activeNav(id) { return page === id || (id === 'timeline' && page === 'search'); }
      function sidebar() {
        const nav = [['home','home','Dashboard'],['timeline','grid','Timeline'],['capsules','lock','Memory capsules'],['story','sparkles','My story'],['privacy','shield','Privacy']];
        return `<aside class="sidebar ${mobileOpen?'open':''}">
          <a class="brand" href="#home" data-action="navigate" data-page="home"><span class="brand-mark">${icon('sparkles',19)}</span><span class="brand-copy"><strong>MEMORY VAULT</strong><small>YOUR LIFE, LOVINGLY KEPT</small></span></a>
          <button class="sidebar-create" data-action="new-memory">${icon('plus',16)} Create a memory</button>
          <div class="nav-label">YOUR SPACE</div><nav class="sidebar-nav" aria-label="Main navigation">${nav.map(([id,symbol,label])=>`<button class="nav-button ${activeNav(id)?'active':''}" data-action="navigate" data-page="${id}">${icon(symbol,16)}<span>${label}</span>${id==='capsules'&&state.capsules.length?`<span class="nav-count">${state.capsules.length}</span>`:''}</button>`).join('')}</nav>
          <div class="side-divider"></div><div class="nav-label">COLLECTIONS</div><div class="category-list">${categoryNames.slice(0,5).map((name)=>`<button class="category-link ${activeCategory===name?'selected':''}" data-action="category" data-category="${escapeHTML(name)}"><span class="category-dot"></span>${escapeHTML(name)}</button>`).join('')}</div>
          <div class="sidebar-bottom"><div class="side-private"><span class="privacy-icon">${icon('shield',15)}</span><span><strong>Only you, always</strong><small>Saved privately in this browser</small></span></div><div class="profile-row"><span class="avatar">M</span><span class="profile-copy"><strong>My little corner</strong><small>Personal memory vault</small></span>${icon('more',16)}</div></div>
        </aside>`;
      }
      function topbar() {
        const label = ({home:'Dashboard',timeline:page==='search'?'Search memories':'Timeline',capsules:'Memory capsules',story:'My story',privacy:'Privacy'})[page] || 'Dashboard';
        return `<header class="topbar"><button class="mobile-menu" data-action="mobile-menu" aria-label="Open navigation">${icon('menu',19)}</button><div class="breadcrumb"><span>My space</span><span class="crumb-slash">/</span><strong>${label}</strong></div><div class="topbar-right"><form class="top-search" id="global-search">${icon('search',14)}<input name="query" value="${escapeHTML(searchQuery)}" aria-label="Search memories" placeholder="Search a moment, person, place..."><button aria-label="Search">${icon('arrow',14)}</button></form><span class="top-private">${icon('lock',13)} Private vault</span><button class="top-avatar" data-action="navigate" data-page="privacy" aria-label="Open privacy settings">M</button></div></header>`;
      }
      function memoryCard(memory, index = 0) {
        const image = memory.photo || imageUrl('photo-1500530855697-b586d89ba3ee');
        return `<article class="memory-card" style="animation-delay:${Math.min(index,5)*.045}s"><div class="memory-photo"><button class="card-open" data-action="open-memory" data-id="${escapeHTML(memory.id)}" aria-label="Open ${escapeHTML(memory.title)}"><img loading="lazy" src="${escapeHTML(image)}" alt="${escapeHTML(memory.title)}"><span class="photo-shade"></span><span class="photo-date">${icon('calendar',12)} ${escapeHTML(formatDate(memory.date,{month:'short',day:'numeric'}))}</span><span class="photo-count">${icon('image',12)} 1 photo</span></button><button class="favorite-button ${memory.favorite?'is-favorite':''}" data-action="favorite" data-id="${escapeHTML(memory.id)}" aria-label="${memory.favorite?'Remove from':'Add to'} favorites">${icon('heart',15)}</button></div><div class="memory-card-copy"><div class="memory-card-title"><h3>${escapeHTML(memory.title)}</h3>${icon('arrow',14)}</div><div class="memory-info">${memory.location?`${icon('map',11)} ${escapeHTML(memory.location)} <span>·</span>`:''}${escapeHTML(formatDate(memory.date,{month:'long',year:'numeric'}))}</div><p class="memory-description">${escapeHTML(memory.description)}</p><div class="tags">${(memory.tags||[]).slice(0,3).map((tag)=>`<span class="tag">${escapeHTML(tag)}</span>`).join('')}</div></div></article>`;
      }
      function emptyState(title, message, action = 'new-memory', label = 'Create a memory') {
        return `<div class="empty-state"><span class="empty-icon">${icon('image',20)}</span><h3>${escapeHTML(title)}</h3><p>${escapeHTML(message)}</p><button class="button-secondary" data-action="${action}">${icon(action==='new-memory'?'plus':'sparkles',14)} ${escapeHTML(label)}</button></div>`;
      }
      function dashboard() {
        const recent = [...state.memories].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
        const favorites = state.memories.filter((memory)=>memory.favorite).slice(0,3);
        const thisDay = state.memories.find((memory)=>{const d=parseDate(memory.date);const now=new Date();return d.getMonth()===now.getMonth()&&d.getDate()===now.getDate()&&d.getFullYear()<now.getFullYear();}) || state.memories[state.memories.length-1];
        const counts = categoryNames.map((name)=>({name,count:state.memories.filter((memory)=>memory.category===name).length})).filter((item)=>item.count);
        return `<section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-dot"></span>YOUR LIFE, LOVINGLY KEPT</div><h1>Preserve Moments.<br><em>Relive Stories.</em></h1><p>Your best memories deserve more than a camera roll. Give every moment a place, a little context, and a way back.</p><div class="hero-actions"><button class="button-primary" data-action="new-memory">${icon('plus',15)} Create a Memory</button><button class="button-secondary" data-action="navigate" data-page="timeline">${icon('grid',14)} Explore Memories</button></div><div class="hero-note">${icon('shield',13)} Personal by design. Yours to keep.</div></div><div class="hero-art" aria-hidden="true"><div class="hero-image-back"><img src="${imageUrl('photo-1500530855697-b586d89ba3ee')}" alt=""></div><div class="hero-image-front"><img src="${imageUrl('photo-1529156069898-49953e39b3ac')}" alt=""><span>the days we keep</span></div><div class="hero-sticker">${icon('heart',14)}<span>worth remembering</span></div><span class="hero-sparkle sparkle-1">✳</span><span class="hero-sparkle sparkle-2">✦</span><span class="hero-sparkle sparkle-3">✧</span></div></section>
          <section class="stats" aria-label="Memory statistics"><div class="stat-card"><span class="stat-icon">${icon('image',17)}</span><span class="stat-copy"><strong>${state.memories.length}</strong><small>Memories saved</small></span></div><div class="stat-card"><span class="stat-icon pink">${icon('heart',17)}</span><span class="stat-copy"><strong>${favorites.length}</strong><small>Favorite moments</small></span></div><div class="stat-card"><span class="stat-icon gold">${icon('lock',17)}</span><span class="stat-copy"><strong>${state.capsules.length}</strong><small>Future capsules</small></span></div></section>
          <section class="section"><div class="section-heading"><div><div class="eyebrow">A FEW RECENT FAVORITES</div><h2>Moments, <span>lately.</span></h2></div><button class="text-link" data-action="navigate" data-page="timeline">Explore all memories ${icon('arrow',14)}</button></div>${recent.length?`<div class="memory-grid">${recent.map(memoryCard).join('')}</div>`:emptyState('Your story starts here.','Add a photo and give your first moment a home.')}</section>
          ${favorites.length?`<section class="section"><div class="section-heading"><div><div class="eyebrow">KEPT A LITTLE CLOSER</div><h2>Your <span>favorites.</span></h2></div></div><div class="memory-grid">${favorites.map(memoryCard).join('')}</div></section>`:''}
          <section class="dashboard-bottom"><div class="on-this-day"><div class="mini-heading"><span class="icon">${icon('calendar',14)}</span>ON THIS DAY</div>${thisDay?`<button class="day-feature" data-action="open-memory" data-id="${escapeHTML(thisDay.id)}"><img src="${escapeHTML(thisDay.photo)}" alt=""><span class="day-copy"><small>A LITTLE HELLO FROM THE PAST</small><strong>${escapeHTML(thisDay.title)}</strong><span>${escapeHTML(formatDate(thisDay.date))} · ${escapeHTML(thisDay.location||thisDay.category)}</span></span></button>`:emptyState('A memory for another day.','Your on-this-day moments will appear here.','new-memory','Add your first photo')}<div class="day-foot">Some moments find their way back.</div></div><div class="privacy-panel"><span class="privacy-mark">${icon('shield',18)}</span><div><div class="eyebrow">YOUR SPACE, YOURS ALONE</div><h3>Good memories.<br>Good boundaries.</h3><p>Your memories stay in this browser. No public profile, no surprise sharing, no server in the middle.</p><button data-action="navigate" data-page="privacy">See how privacy works ${icon('arrow',12)}</button></div><span class="privacy-decoration">✳</span></div></section>
          ${counts.length?`<section class="section"><div class="section-heading"><div><div class="eyebrow">LITTLE CHAPTERS</div><h2>Browse by <span>feeling.</span></h2></div></div><div class="filter-toolbar">${counts.map(({name,count})=>`<button class="filter-chip" data-action="category" data-category="${escapeHTML(name)}"><span class="category-dot"></span>${escapeHTML(name)} <span>${count}</span></button>`).join('')}</div></section>`:''}<div class="closing-line">Memory Vault keeps the moments.<strong>You keep the meaning.</strong></div>`;
      }
      function timelinePage() {
        const normalized = searchQuery.trim().toLowerCase();
        const memories = state.memories.filter((memory)=>{
          const categoryMatch=activeCategory==='All memories'||memory.category===activeCategory||(memory.tags||[]).includes(activeCategory);
          const text=[memory.title,memory.location,memory.description,memory.category,memory.people,...(memory.tags||[])].join(' ').toLowerCase();
          return categoryMatch&&(!normalized||text.includes(normalized)||normalized.split(/\s+/).some((word)=>word.length>2&&text.includes(word)));
        }).sort((a,b)=>sortOrder==='newest'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
        const grouped = new Map();
        memories.forEach((memory)=>{const year=parseDate(memory.date).getFullYear();if(!grouped.has(year))grouped.set(year,[]);grouped.get(year).push(memory);});
        return `<div class="page"><div class="page-heading"><div><div class="eyebrow">A LIFE, IN LITTLE CHAPTERS</div><h1>Your story, <em>over time.</em></h1><p>Search, filter, and find your way back to a moment.</p></div><button class="button-primary" data-action="new-memory">${icon('plus',14)} Add memory</button></div>
          <div class="filter-toolbar"><span class="filter-caption">CATEGORY</span><button class="filter-chip ${activeCategory==='All memories'?'active':''}" data-action="category" data-category="All memories">All memories <span>${state.memories.length}</span></button>${categoryNames.map((name)=>`<button class="filter-chip ${activeCategory===name?'active':''}" data-action="category" data-category="${escapeHTML(name)}"><span class="category-dot"></span>${escapeHTML(name)}</button>`).join('')}</div>
          <div class="timeline-tools"><label class="timeline-search">${icon('search',14)}<input id="timeline-query" value="${escapeHTML(searchQuery)}" placeholder="Try a person, place, or feeling..." aria-label="Search memories"></label><select class="sort-select" id="timeline-sort" aria-label="Sort memories"><option value="newest" ${sortOrder==='newest'?'selected':''}>Newest first</option><option value="oldest" ${sortOrder==='oldest'?'selected':''}>Oldest first</option></select></div>
          ${memories.length?[...grouped.entries()].map(([year,items])=>`<div class="timeline"><div class="timeline-year"><div class="year-label">${year}</div><div class="year-items">${groupMonths(items).map(([month,monthItems])=>`<div class="timeline-month"><span class="month-dot"></span><div class="month-label">${escapeHTML(month)}</div>${monthItems.map((memory)=>`<button class="timeline-card" data-action="open-memory" data-id="${escapeHTML(memory.id)}"><img src="${escapeHTML(memory.photo)}" alt=""><span class="timeline-copy"><small>${icon('calendar',10)} ${escapeHTML(formatDate(memory.date,{month:'short',day:'numeric'}))} ${memory.location?`· ${icon('map',10)} ${escapeHTML(memory.location)}`:''}</small><strong>${escapeHTML(memory.title)}</strong><span>${escapeHTML(memory.description)}</span></span><span class="timeline-open">${icon('arrow',13)}</span></button>`).join('')}</div>`).join('')}</div></div></div>`).join(''):emptyState(normalized||activeCategory!=='All memories'?'No moments found.':'Your next favorite moment is waiting.','Try another search or category, or add a photo to start a new memory.',normalized||activeCategory!=='All memories'?'clear-filters':'new-memory',normalized||activeCategory!=='All memories'?'Clear filters':'Create a memory')}</div>`;
      }
      function groupMonths(memories) {
        const months = new Map();
        memories.forEach((memory)=>{const name=formatDate(memory.date,{month:'long'});if(!months.has(name))months.set(name,[]);months.get(name).push(memory);});
        return [...months.entries()];
      }
      function storyPage() {
        return `<div class="page"><section class="story-hero"><div class="eyebrow">${icon('sparkles',13)} A STORY, MADE FROM YOUR MOMENTS</div><h1>Your life is already a beautiful story.</h1><p>We’ll gather the places, people, and little details in your saved memories and turn them into something you can read again.</p><div class="story-controls"><button class="button-primary" data-action="create-story">${icon('sparkles',14)} Create My Story</button>${state.memories.length?`<span class="form-hint">${state.memories.length} memories to weave together</span>`:''}</div></section>${state.story?`<article class="story-output"><div class="eyebrow">YOUR MEMORY VAULT STORY</div><h2>${escapeHTML(state.story.title)}</h2>${state.story.paragraphs.map((paragraph)=>`<p>${escapeHTML(paragraph)}</p>`).join('')}<div class="story-signoff">Written from your moments, kept just for you.</div></article>`:state.memories.length?`<div class="story-empty"><span class="empty-icon">${icon('sparkles',19)}</span><h3>Your story is waiting to be told.</h3><p>One little button turns your saved memories into a story.</p><button class="button-secondary" data-action="create-story">${icon('sparkles',14)} Create My Story</button></div>`:emptyState('A story needs a first page.','Add a memory first, then we’ll help connect the moments.','new-memory','Create a memory')}</div>`;
      }
      function capsulePage() {
        const now=today();
        return `<div class="page"><section class="capsule-hero"><div class="capsule-copy"><div class="eyebrow">${icon('lock',13)} A NOTE FROM NOW, FOR LATER</div><h1>Leave a little <em>something.</em></h1><p>Pick a future day, write yourself a note, and let this moment wait quietly until then.</p><button class="button-primary" data-action="new-capsule">${icon('plus',14)} Create a Memory Capsule</button></div><div class="capsule-visual" aria-hidden="true"><span class="capsule-star left">✳</span><div class="capsule-envelope"><span class="envelope-seal">${icon('lock',20)}</span></div><span class="capsule-star right">✦</span><span class="capsule-label">just for later</span></div></section><div class="capsule-list-head"><div><div class="eyebrow">SAVED FOR ANOTHER DAY</div><h2>Your little time capsules</h2></div><span class="capsule-count">${state.capsules.length} saved</span></div>${state.capsules.length?`<div class="capsule-grid">${state.capsules.map((capsule)=>{const unlocked=capsule.unlockDate<=now;const photo=capsule.photo||state.memories.find((memory)=>memory.id===capsule.memoryId)?.photo;const cover=photo?`<img src="${escapeHTML(photo)}" alt="">`:`<span class="capsule-cover-empty">${icon('lock',27)}</span>`;return `<article class="capsule-card"><div class="capsule-cover">${cover}<span class="capsule-status">${icon(unlocked?'check':'lock',13)} ${unlocked?'Ready to open':'Still tucked away'}</span><button class="capsule-delete" data-action="delete-capsule" data-id="${escapeHTML(capsule.id)}" aria-label="Delete capsule">${icon('trash',13)}</button></div><div class="capsule-body"><div class="eyebrow">${unlocked?'THE DAY HAS ARRIVED':'FOR YOUR FUTURE SELF'}</div><h3>${escapeHTML(capsule.title)}</h3><p>“${escapeHTML(capsule.message)}”</p><div class="capsule-date">${icon('calendar',13)}<span>${unlocked?'Ready since':'Opens on'} <strong>${escapeHTML(formatDate(capsule.unlockDate))}</strong></span></div>${unlocked?`<button class="capsule-open" data-action="open-capsule" data-id="${escapeHTML(capsule.id)}">Open your note ${icon('arrow',12)}</button>`:''}</div></article>`;}).join('')}</div>`:emptyState('A memory waiting for your future self.','Your first capsule could open on a birthday, a reunion, or an ordinary Tuesday years from now.','new-capsule','Make your first capsule')}<div class="capsule-note">${icon('shield',15)}<span><strong>A little note about the lock.</strong> This demo checks the date in your browser. Capsules stay on this device; there is no scheduled email or server delivery.</span></div></div>`;
      }
      function privacyPage() {
        return `<div class="page"><div class="page-heading"><div><div class="eyebrow">YOUR SPACE, YOUR RULES</div><h1>Privacy is part of <em>the memory.</em></h1><p>A few clear things about where your photos and stories live.</p></div></div><section class="privacy-banner"><span class="privacy-banner-icon">${icon('shield',21)}</span><div><h2>Your memories belong to you.</h2><p>This is a local-first demo. Your memory details are stored in this browser, not uploaded to a Memory Vault server. Sample cover photos are fetched from Unsplash; photos you add are saved as compressed image data in this browser’s local storage.</p></div></section><div class="privacy-cards"><article class="privacy-card"><span class="stat-icon">${icon('lock',17)}</span><h3>Stored on this device</h3><p>Memory data stays in this browser’s localStorage. Clearing browser site data can remove it, so keep your original photos somewhere safe.</p></article><article class="privacy-card"><span class="stat-icon pink">${icon('heart',17)}</span><h3>No public audience</h3><p>There are no public profiles, feeds, accounts, or sharing links. Your vault is a private experience on this device.</p></article><article class="privacy-card"><span class="stat-icon gold">${icon('sparkles',17)}</span><h3>Story helper runs locally</h3><p>The demo story is composed in JavaScript from your saved titles, places, descriptions, and tags. No AI API or key is used.</p></article></div><section class="privacy-data"><h3>Your local collection</h3><p>${state.memories.length} memories and ${state.capsules.length} capsules are currently saved in this browser. Restoring samples keeps your personal memories.</p><div class="privacy-actions"><button class="button-secondary" data-action="restore-demo">${icon('image',14)} Restore sample memories</button><button class="button-quiet" data-action="remove-demo">${icon('trash',13)} Remove sample memories</button><button class="button-quiet" data-action="clear-all">${icon('trash',13)} Clear all local data</button></div></section></div>`;
      }
      function render() {
        const content = page==='home'?dashboard():page==='timeline'||page==='search'?timelinePage():page==='story'?storyPage():page==='capsules'?capsulePage():privacyPage();
        app.innerHTML = `<div class="app">${sidebar()}<main class="main">${topbar()}<div class="content">${content}<footer class="page-footer"><span>Memory Vault · Your moments, in your words</span><span>Private by design <span aria-hidden="true">·</span> Made to remember</span></footer></div></main>${mobileOpen?'<button class="mobile-scrim" data-action="close-mobile" aria-label="Close menu"></button>':''}</div>${modal?modalMarkup():''}`;
      }
      function modalMarkup() {
        if (modal==='memory-form') return memoryForm();
        if (modal==='capsule-form') return capsuleForm();
        if (modal==='memory-detail') return memoryDetail();
        if (modal==='capsule-detail') return capsuleDetail();
        return '';
      }
      function memoryForm() {
        return `<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="memory-form-title"><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('close',16)}</button><div class="modal-kicker"><span class="icon">${icon('image',14)}</span> ADD A LITTLE CHAPTER</div><h2 class="modal-title" id="memory-form-title">Save this <em>moment.</em></h2><p class="modal-subtitle">A photo, a few details, and this memory has a place of its own.</p><form id="memory-form"><div class="photo-upload"><span class="photo-upload-preview" id="photo-preview">${draftPhoto?`<img src="${draftPhoto}" alt="Selected photo">`:icon('upload',18)}</span><span class="photo-upload-copy"><strong>Add a photo</strong><small>JPG or PNG · compressed on this device</small></span><input id="memory-photo" type="file" accept="image/jpeg,image/png" aria-label="Upload a memory photo"></div><div class="form-row"><label class="field-label">MEMORY TITLE<input name="title" required maxlength="80" placeholder="A little Goa escape"></label><label class="field-label">DATE<input name="date" type="date" max="${today()}" value="${today()}" required></label></div><div class="form-row"><label class="field-label">LOCATION<input name="location" maxlength="80" placeholder="A place worth remembering"></label><label class="field-label">CATEGORY<select name="category" required>${categoryNames.map((name)=>`<option>${escapeHTML(name)}</option>`).join('')}</select></label></div><label class="field-label">THE STORY SO FAR<textarea name="description" maxlength="360" required placeholder="What do you want to remember about this day?"></textarea></label><label class="field-label">PEOPLE OR TAGS<input name="tags" maxlength="120" placeholder="Friends, beach, summer (separate with commas)"></label><label class="form-check"><input name="favorite" type="checkbox"> Keep this one close — mark as a favorite</label><div class="modal-actions"><span class="form-hint">Saved privately in this browser.</span><button class="button-primary" type="submit">${icon('check',14)} Save Memory</button></div></form></section></div>`;
      }
      function capsuleForm() {
        const memories=state.memories;
        return `<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="capsule-form-title"><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('close',16)}</button><div class="modal-kicker"><span class="icon">${icon('lock',14)}</span> A NOTE FROM NOW, FOR LATER</div><h2 class="modal-title" id="capsule-form-title">Dear future <em>you...</em></h2><p class="modal-subtitle">Choose a day, tuck in a note, and let a memory wait quietly.</p><form id="capsule-form"><label class="field-label">GIVE THIS CAPSULE A NAME<input name="title" maxlength="70" required placeholder="A note for future me"></label><label class="field-label">YOUR NOTE<textarea name="message" maxlength="360" required rows="3" placeholder="What do you hope you’ll remember?"></textarea></label><div class="form-row"><label class="field-label">OPEN ON<input type="date" name="unlockDate" min="${tomorrow()}" required></label><label class="field-label">ATTACH A MEMORY<select class="capsule-memory-select" name="memoryId"><option value="">No photo, just a note</option>${memories.map((memory)=>`<option value="${escapeHTML(memory.id)}">${escapeHTML(memory.title)}</option>`).join('')}</select></label></div><div class="capsule-form-note">${icon('shield',13)} Your capsule stays in this browser. The unlock date is checked when you open Memory Vault.</div><div class="modal-actions"><span class="form-hint">A small gift to your future self.</span><button class="button-primary" type="submit">${icon('lock',14)} Tuck it away</button></div></form></section></div>`;
      }
      function memoryDetail() {
        const memory=state.memories.find((item)=>item.id===selectedMemoryId);
        if(!memory){modal='';return ''}
        const timeline=(memory.timeline||[]).map((entry)=>{const split=entry.split(' · ');return `<div class="detail-event"><span class="event-dot"></span><span class="event-time">${escapeHTML(split[0])}</span><span class="event-title">${escapeHTML(split[1]||entry)}</span><span class="event-tag">${escapeHTML(memory.category)}</span></div>`}).join('');
        return `<div class="modal-backdrop" data-action="backdrop-close"><article class="modal wide" role="dialog" aria-modal="true" aria-label="${escapeHTML(memory.title)}"><div class="memory-detail-cover"><img src="${escapeHTML(memory.photo)}" alt="${escapeHTML(memory.title)}"><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('close',16)}</button><div class="detail-cover-copy"><div class="eyebrow">A LITTLE CHAPTER</div><h2>${escapeHTML(memory.title)}</h2><div class="detail-meta"><span>${icon('calendar',12)} ${escapeHTML(formatDate(memory.date))}</span>${memory.location?`<span>${icon('map',12)} ${escapeHTML(memory.location)}</span>`:''}<span>${icon('image',12)} 1 photo</span></div></div></div><div class="detail-body"><div class="detail-story"><div><div class="eyebrow">THE STORY SO FAR</div><p>${escapeHTML(memory.description)}</p><div class="detail-tags">${(memory.tags||[]).map((tag)=>`<span class="tag">${escapeHTML(tag)}</span>`).join('')}</div>${memory.people?`<p><strong>With</strong> ${escapeHTML(memory.people)}</p>`:''}</div><div class="page-actions"><button class="button-secondary" data-action="favorite" data-id="${escapeHTML(memory.id)}">${icon('heart',13)} ${memory.favorite?'Favorited':'Favorite'}</button><button class="button-quiet" data-action="delete-memory" data-id="${escapeHTML(memory.id)}">${icon('trash',13)} Delete</button></div></div><div class="detail-timeline"><div class="eyebrow">THE LITTLE DETAILS</div><h3>A day in moments.</h3>${timeline||`<div class="detail-event"><span class="event-dot"></span><span class="event-time">${escapeHTML(formatDate(memory.date,{month:'short',day:'numeric'}))}</span><span class="event-title">${escapeHTML(memory.description)}</span><span class="event-tag">${escapeHTML(memory.category)}</span></div>`}</div></div></article></div>`;
      }
      function capsuleDetail() {
        const capsule=state.capsules.find((item)=>item.id===selectedCapsuleId);
        if(!capsule)return '';
        const photo=capsule.photo||state.memories.find((memory)=>memory.id===capsule.memoryId)?.photo;
        return `<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-label="Opened capsule"><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('close',16)}</button>${photo?`<div class="memory-detail-cover" style="height:170px;margin:-25px -26px 18px"><img src="${escapeHTML(photo)}" alt=""></div>`:''}<div class="modal-kicker">${icon('sparkles',13)} FROM YOUR PAST SELF</div><h2 class="modal-title">${escapeHTML(capsule.title)}</h2><p class="story-output" style="margin:12px 0;padding:16px;font-family:'Playfair Display',serif;font-size:13px">“${escapeHTML(capsule.message)}”</p><div class="capsule-date">${icon('calendar',13)} Saved for <strong>${escapeHTML(formatDate(capsule.unlockDate))}</strong></div><div class="modal-actions"><span class="form-hint">Kept close, just for you.</span><button class="button-secondary" data-action="close-modal">${icon('heart',13)} Keep this close</button></div></section></div>`;
      }
      function openModal(name) { modal=name;draftPhoto='';render();document.querySelector('.modal input:not([type=checkbox]):not([type=file])')?.focus(); }
      function closeModal() { modal='';selectedMemoryId=null;selectedCapsuleId=null;draftPhoto='';render(); }
      function navigate(next) { page=next;mobileOpen=false;if(next!=='search')searchQuery='';render();window.scrollTo({top:0,behavior:'smooth'}); }
      function categoryFilter(category) { activeCategory=category;page='timeline';mobileOpen=false;render();window.scrollTo({top:0,behavior:'smooth'}); }
      function generateStory() {
        if(!state.memories.length){notify('Add a memory first, and your story can begin.');return;}
        const memories=[...state.memories].sort((a,b)=>a.date.localeCompare(b.date));
        const first=memories[0],last=memories[memories.length-1];
        const places=[...new Set(memories.map((memory)=>memory.location).filter(Boolean))];
        const people=[...new Set(memories.flatMap((memory)=>(memory.people||'').split(/[,&]/).map((name)=>name.trim()).filter(Boolean)))].slice(0,4);
        const details=memories.slice(0,3).map((memory)=>memory.description.trim().replace(/[.!?]+$/,'')).filter(Boolean);
        const paragraphs=[
          `It began with ${first.title.toLowerCase()}, on ${formatDate(first.date,{month:'long',year:'numeric'})}. Somewhere along the way, ${memories.length===1?'one small moment found its place in your vault':`${memories.length} little chapters began to make a story`}.`,
          details.length?`${details.join('. ')}. Each moment holds onto a detail that an ordinary camera roll might let slip away.`:'Each saved moment holds a detail worth returning to.',
          `${places.length?`Across ${places.slice(0,3).join(', ')}`:'Across the places that feel like yours'}${people.length?`, with ${people.join(', ')}`:''}, your days have made room for laughter, change, and the quiet things that matter. ${last.title} is only the latest page; the best part is that the story is still yours to keep.`
        ];
        const story={title:`The little things that became everything`,paragraphs};
        persist({...state,story});page='story';render();window.scrollTo({top:0,behavior:'smooth'});notify('Your story is ready to read.');
      }
      function compressImage(file) {
        return new Promise((resolve,reject)=>{
          const reader=new FileReader();
          reader.onerror=()=>reject(reader.error||new Error('Could not read image'));
          reader.onload=()=>{
            const image=new Image();image.onerror=()=>reject(new Error('This image could not be opened'));
            image.onload=()=>{const scale=Math.min(1,1500/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const context=canvas.getContext('2d');if(!context){resolve(reader.result);return;}context.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82));};
            image.src=reader.result;
          };
          reader.readAsDataURL(file);
        });
      }
      function handleClick(event) {
        const button=event.target.closest('[data-action]');if(!button)return;
        const action=button.dataset.action;
        if(action==='navigate')return navigate(button.dataset.page);
        if(action==='new-memory'){draftPhoto='';return openModal('memory-form');}
        if(action==='new-capsule')return openModal('capsule-form');
        if(action==='mobile-menu'){mobileOpen=true;return render();}
        if(action==='close-mobile'){mobileOpen=false;return render();}
        if(action==='category')return categoryFilter(button.dataset.category);
        if(action==='open-memory'){selectedMemoryId=button.dataset.id;return openModal('memory-detail');}
        if(action==='favorite'){
          const id=button.dataset.id;const memory=state.memories.find((item)=>item.id===id);if(!memory)return;
          persist({...state,memories:state.memories.map((item)=>item.id===id?{...item,favorite:!item.favorite}:item)});render();notify(memory.favorite?'Removed from favorites.':'Saved to your favorites.');return;
        }
        if(action==='close-modal')return closeModal();
        if(action==='backdrop-close'&&event.target===button)return closeModal();
        if(action==='clear-filters'){searchQuery='';activeCategory='All memories';return render();}
        if(action==='delete-memory'){
          if(!window.confirm('Delete this memory from this browser?'))return;
          persist({...state,memories:state.memories.filter((memory)=>memory.id!==button.dataset.id)});closeModal();notify('Memory removed from your vault.');return;
        }
        if(action==='create-story')return generateStory();
        if(action==='delete-capsule'){
          if(!window.confirm('Delete this time capsule?'))return;
          persist({...state,capsules:state.capsules.filter((capsule)=>capsule.id!==button.dataset.id)});render();notify('Time capsule deleted.');return;
        }
        if(action==='open-capsule'){
          const capsule=state.capsules.find((item)=>item.id===button.dataset.id);if(!capsule)return;
          if(capsule.unlockDate>today()){notify(`This capsule opens on ${formatDate(capsule.unlockDate)}.`);return;}
          selectedCapsuleId=capsule.id;return openModal('capsule-detail');
        }
        if(action==='restore-demo'){
          const personal=state.memories.filter((memory)=>!memory.demo);const demo=demoMemories.filter((sample)=>!state.memories.some((memory)=>memory.id===sample.id));
          persist({...state,memories:[...demo,...personal]});render();notify('Sample memories restored. Your photos are still here.');return;
        }
        if(action==='remove-demo'){
          persist({...state,memories:state.memories.filter((memory)=>!memory.demo)});render();notify('Sample memories removed. Your own memories are still here.');return;
        }
        if(action==='clear-all'){
          if(!window.confirm('Clear all memories and capsules saved in this browser?'))return;
          persist({memories:[],capsules:[]});page='home';render();notify('Your local vault is clear.');
        }
      }
      function handleSubmit(event) {
        const form=event.target;
        if(form.id==='global-search'){
          event.preventDefault();searchQuery=new FormData(form).get('query').toString().trim();activeCategory='All memories';page='search';render();return;
        }
        if(form.id==='memory-form'){
          event.preventDefault();const data=new FormData(form);const file=document.getElementById('memory-photo')?.files?.[0];
          const create=async()=>{
            if(file&&!draftPhoto)draftPhoto=await compressImage(file);
            const memory={id:`memory-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,title:String(data.get('title')).trim(),date:String(data.get('date')),location:String(data.get('location')).trim(),description:String(data.get('description')).trim(),category:String(data.get('category')),tags:String(data.get('tags')).split(',').map((tag)=>tag.trim()).filter(Boolean).slice(0,8),people:String(data.get('tags')).trim(),favorite:data.has('favorite'),photo:draftPhoto||imageUrl('photo-1500530855697-b586d89ba3ee'),timeline:[`${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · A moment saved in Memory Vault`]};
            const result=persist({...state,memories:[memory,...state.memories]});modal='';draftPhoto='';page='timeline';activeCategory='All memories';render();notify(result?'A new memory is safely tucked away.':'Memory added for this session. Check browser storage to keep it.');
          };
          const submitButton=form.querySelector('[type=submit]');submitButton.disabled=true;submitButton.textContent='Saving your moment…';create().catch((error)=>{console.error(error);notify('That photo could not be saved. Try another image.');submitButton.disabled=false;submitButton.textContent='Save Memory';});return;
        }
        if(form.id==='capsule-form'){
          event.preventDefault();const data=new FormData(form);const unlockDate=String(data.get('unlockDate'));
          if(unlockDate<=today()){notify('Choose a date in the future.');return;}
          const memory=state.memories.find((item)=>item.id===String(data.get('memoryId')));
          const capsule={id:`capsule-${Date.now()}`,title:String(data.get('title')).trim(),message:String(data.get('message')).trim(),unlockDate,memoryId:memory?.id||'',photo:memory?.photo||'',createdAt:new Date().toISOString()};
          persist({...state,capsules:[capsule,...state.capsules]});modal='';page='capsules';render();notify('Your note is tucked away for another day.');
        }
      }
      function handleChange(event) {
        if(event.target.id==='memory-photo'){
          const file=event.target.files?.[0];if(!file)return;
          if(!['image/jpeg','image/png'].includes(file.type)){notify('Choose a JPG or PNG image.');event.target.value='';return;}
          if(file.size>12*1024*1024){notify('Choose an image smaller than 12 MB.');event.target.value='';return;}
          compressImage(file).then((src)=>{draftPhoto=src;const preview=document.getElementById('photo-preview');if(preview)preview.innerHTML=`<img src="${src}" alt="Selected photo">`;}).catch(()=>notify('This image could not be opened. Try another photo.'));
        }
        if(event.target.id==='timeline-sort'){
          sortOrder=event.target.value;render();
        }
      }
      function handleInput(event) {
        if(event.target.id!=='timeline-query')return;
        searchQuery=event.target.value;
        const position=event.target.selectionStart;
        render();
        const input=document.getElementById('timeline-query');
        input?.focus();
        input?.setSelectionRange(position,position);
      }
      document.addEventListener('click',handleClick);
      document.addEventListener('submit',handleSubmit);
      document.addEventListener('change',handleChange);
      document.addEventListener('input',handleInput);
      render();
    })();
  </script>
</body>
</html>
